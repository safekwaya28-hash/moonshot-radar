name: Scan B despegues

on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch: {}
  push:
    paths: ["scan_b.py", ".github/workflows/scan_b.yml"]

permissions:
  contents: write

concurrency:
  group: moonshot-scanb
  cancel-in-progress: false

jobs:
  scanb:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOLANA_RPC: ${{ secrets.SOLANA_RPC }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recuperar estado
        uses: actions/cache/restore@v4
        with:
          path: .moonshot
          key: scanb-${{ github.run_id }}
          restore-keys: scanb-

      - name: Scan B
        run: python scan_b.py

      - name: Guardar estado
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .moonshot
          key: scanb-${{ github.run_id }}

      - name: Publicar
        if: always()
        run: |
          git config user.name "moonshot-bot"
          git config user.email "moonshot-bot@users.noreply.github.com"
          for f in report/SCAN_B.md scan_b_log.jsonl; do
            if [ -e "$f" ]; then git add -A "$f"; fi
          done
          git commit -m "scan B $(date -u +%Y-%m-%dT%H:%MZ)" || echo "sin cambios"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
