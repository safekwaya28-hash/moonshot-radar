name: Scan C metas

on:
  schedule:
    - cron: "20,50 * * * *"
  workflow_dispatch: {}
  push:
    paths: ["scan_c.py", ".github/workflows/scan_c.yml"]

permissions:
  contents: write

concurrency:
  group: moonshot-scanc
  cancel-in-progress: false

jobs:
  scanc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOLANA_RPC: ${{ secrets.SOLANA_RPC }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scan C
        run: python scan_c.py

      - name: Publicar
        if: always()
        run: |
          git config user.name "moonshot-bot"
          git config user.email "moonshot-bot@users.noreply.github.com"
          for f in report/SCAN_C.md scan_c; do
            if [ -e "$f" ]; then git add -A "$f"; fi
          done
          git commit -m "scan C $(date -u +%Y-%m-%dT%H:%MZ)" || echo "sin cambios"
          for i in 1 2 3; do
            git pull --rebase --autostash -X theirs origin main && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep 10
          done
          exit 1
