name: Moonshot Radar

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch: {}
  push:
    paths: ["**.py", "wallets_to_add.txt", "moonshot_config.json", "manual_checks.csv", ".github/workflows/moonshot.yml"]

permissions:
  contents: write

concurrency:
  group: moonshot-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOLANA_RPC: ${{ secrets.SOLANA_RPC }}
      MOONSHOT_NO_BROWSER: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Recuperar caché de transacciones
        uses: actions/cache/restore@v4
        with:
          path: .moonshot
          key: txcache-${{ github.run_id }}
          restore-keys: txcache-

      - name: Verificar wallets nuevas (wallets_to_add.txt)
        run: python moonshot.py add-wallets-file wallets_to_add.txt

      - name: Radar (12 criterios)
        run: python moonshot.py radar --publish report

      - name: Diagnóstico (report/STATUS.md)
        if: always()
        run: python moonshot.py status report || true

      - name: Guardar caché de transacciones
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .moonshot
          key: txcache-${{ github.run_id }}

      - name: Publicar informe
        if: always()
        run: |
          mkdir -p report
          touch radar_log.jsonl
          git config user.name "moonshot-bot"
          git config user.email "moonshot-bot@users.noreply.github.com"
          for f in report radar_log.jsonl smart_wallets.csv wallets_to_add.txt manual_checks.csv; do
            if [ -e "$f" ]; then git add -A "$f"; fi
          done
          git commit -m "radar $(date -u +%Y-%m-%dT%H:%MZ)" || echo "sin cambios"
          git pull --rebase --autostash
          git push
